spring.application.name=sogaffer

sogaffer.jwt.access.aud=SoGaffer
sogaffer.jwt.access.secret=${SOGAFFER_JWT_SECRET}

sogaffer.encryption.secret=${SOGAFFER_ENCRYPTION_SECRET}

# Access token duration time in seconds (1 h * 60 min * 60 sec = 3600 s)
sogaffer.jwt.access.duration=3600

# Database connection settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration