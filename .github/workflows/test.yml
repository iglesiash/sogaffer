name: Build Backend + Frontend

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend (includes frontend)
        env:
          SOGAFFER_JWT_SECRET: ${{ secrets.SOGAFFER_JWT_SECRET }}
        run: mvn -B clean package -f backend/pom.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sogaffer
          path: backend/target/*.jar
